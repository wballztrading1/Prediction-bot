name: keep-awake

# Render's free plan sleeps after 15 min without traffic and takes ~1 min to wake.
# Hitting the free /health route every 10 min keeps it awake for agents.
# /health makes no Grok call and no payment. Delete this file after moving to a paid Render plan.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping /health
        run: |
          code=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 90 --retry 2 --retry-delay 10 https://prediction-bot-iggf.onrender.com/health)
          echo "health HTTP $code"
          test "$code" = "200"
