[project]
name = "prediction-bot-mcp"
version = "0.2.0"
description = "MCP server for Polymarket/Kalshi X-sentiment scores, paid per call in USDC on Base via x402"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["mcp", "x402", "polymarket", "kalshi", "prediction market", "sentiment", "agent"]
dependencies = [
    "mcp>=2.1,<3",
    "httpx>=0.28.1",
    "x402[httpx,evm]>=2.8",
]

[project.urls]
Homepage = "https://prediction-bot-iggf.onrender.com/about"
Repository = "https://github.com/wballztrading1/Prediction-bot"

[project.scripts]
prediction-bot-mcp = "prediction_bot_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["prediction_bot_mcp"]
